<!DOCTYPE html>
<html>
<head>
    <title>Edit File - Cloud Assurance</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .header {
            background: #172b4d;
            color: white;
            padding: 20px 40px;
        }

        .header h1 {
            margin: 0;
        }

        .container {
            max-width: 900px;
            margin: 35px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        textarea {
            width: 100%;
            height: 350px;
            padding: 15px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-family: monospace;
            font-size: 15px;
            resize: vertical;
        }

        .save {
            margin-top: 15px;
            padding: 11px 20px;
            background: #198754;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 15px;
        }

        .back {
            display: inline-block;
            margin-top: 15px;
            margin-left: 8px;
            padding: 11px 20px;
            background: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>☁️ Cloud Assurance — Edit File</h1>
</div>


<div class="container">

    <h2>✏️ Edit: {{ filename }}</h2>

    <p>
        You are editing this file using your assigned edit permission.
    </p>

    <form method="POST">

        <textarea name="content" required>{{ content }}</textarea>

        <br>

        <button class="save" type="submit">
            💾 Save Changes
        </button>

        <a class="back" href="/shared">
            ← Back
        </a>

    </form>

</div>

</body>
</html>
